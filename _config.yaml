# site properties and page defaults
title: LoopLeap Lab
subtitle: AI for science and health
logo-text: LoopLeap Lab
description: LoopLeap Lab advances foundational AI through interdisciplinary science and engineering, with applications in scientific discovery and healthcare.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: qian.lou@ucf.edu
  orcid: 0000-0001-5462-2567
  google-scholar: SBYgXLoAAAAJ
  github: loopleap-lab
  twitter: UboundedAI
  youtube: "@Unbounded_AI_UCF"

### jekyll settings
###asd
# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
